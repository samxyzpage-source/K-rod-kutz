  <script>
    // Boot error hook: an uncaught error before the shell is ready leaves a readable line instead of a blank page.
    (function () {
      window.addEventListener('error', function (e) {
        var app = document.getElementById('app');
        var R = window.RTG;
        if (!app || (R && R.UI && R.UI.app && R.UI.app.ready)) return;
        if (app.querySelector('.boot-error')) return;
        var d = document.createElement('div');
        d.className = 'noscript boot-error';
        d.setAttribute('role', 'alert');
        d.textContent = 'ROAD TO GLORY: QB could not start — ' + (e && e.message ? e.message : 'script error') + '. Reload the page; if it persists, open the browser console.';
        app.appendChild(d);
      });
    })();
  </script>
